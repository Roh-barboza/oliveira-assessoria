name: PINCIO | CRM Sheets
on:
  push:
    branches: [feature/pincio-crm-sheets]
  pull_request:
    branches: [feature/pincio-crm-sheets]
permissions:
  contents: read
jobs:
  crm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/pincio-crm-sheets.test.mjs tests/pincio-lead-api.test.mjs tests/pincio-brand.test.mjs
      - run: npm run test:platform
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm test
