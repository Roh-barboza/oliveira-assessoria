name: PINCIO | Correções sem n8n
on:
  push:
    branches: [release/pincio-sem-n8n-2026-11-28]
  pull_request:
    branches: [release/pincio-sem-n8n-2026-11-28]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/pincio-lead-api.test.mjs tests/platform-public-demo-release.test.mjs tests/pincio-brand.test.mjs
      - run: npm run test:platform
      - run: npm run test:editorial
      - run: npm audit --omit=dev
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:operational-ui
