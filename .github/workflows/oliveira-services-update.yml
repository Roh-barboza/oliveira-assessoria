name: Oliveira | Atualização do catálogo público
on:
  push:
    branches:
      - release/catalogo-servicos-2026-11-25
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oliveira-services-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API synthetic and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testar aplicação completa e acesso restrito
        run: npm run test:platform
      - name: Testar modo sintético público sem credenciais reais
        run: node --test tests/platform-public-demo-release.test.mjs
      - name: Auditar dependências de produção
        run: npm audit --omit=dev

  browser:
    name: Full pages and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testar 21 páginas públicas nas resoluções previstas
        run: npm test
      - name: Testar fluxo operacional em navegador com dados sintéticos
        run: npm run test:operational-ui
