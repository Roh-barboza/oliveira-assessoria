name: Oliveira - validação operacional

on:
  push:
    branches:
      - feature/plataforma-operacional-preview
  pull_request:
    paths:
      - 'server/platform/**'
      - 'api/operacional.mjs'
      - 'api/operacional-*.mjs'
      - 'landing/ativacao.*'
      - 'landing/premium-consular.js'
      - 'tests/lead-webhook-contract.mjs'
      - 'landing/operacional.*'
      - 'tests/platform-operational-*'
      - 'tests/platform.test.mjs'
      - 'package*.json'
      - '.github/workflows/oliveira-operational-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oliveira-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operational-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes do backend e fluxo operacional
        run: npm run test:platform
      - name: Testar interface operacional
        run: npm run test:operational-ui
      - name: Auditar dependências de execução
        run: npm audit --omit=dev
