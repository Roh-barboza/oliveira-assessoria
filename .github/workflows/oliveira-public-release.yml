name: Oliveira | Site público provisório
on:
  push:
    branches:
      - release/site-publico-2026-11-24
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oliveira-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Código revisado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verificar compilação estática e separação do painel privado
        run: node --test tests/public-release.test.mjs
      - name: Verificar sintaxe do site publicado
        run: |
          node --check scripts/build-public-release.mjs
          node --check public-release/site.js
          node --check public-release/catalogo.js
